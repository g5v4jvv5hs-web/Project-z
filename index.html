<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Project Z</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#04050a;
  --card:#0b0d15;
  --card2:#0f111b;
  --gold:#f5c84c;
  --purple:#9b6cff;
  --purple2:#c09aff;
  --text:#f7f7fa;
  --muted:#85899a;
  --line:rgba(255,255,255,.075);
}

html{
  background:var(--bg);
  color-scheme:dark;
}

body{
  background:
    radial-gradient(circle at 50% -10%,rgba(112,70,220,.13),transparent 38%),
    radial-gradient(circle at 100% 40%,rgba(76,90,255,.055),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  opacity:.32;
  background:
    linear-gradient(120deg,transparent 0 45%,rgba(155,108,255,.025) 50%,transparent 55%),
    radial-gradient(circle at 20% 70%,rgba(245,200,76,.03),transparent 24%);
}

button{
  font-family:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

#app{
  min-height:100vh;
  min-height:100dvh;
  padding-bottom:calc(82px + env(safe-area-inset-bottom));
}

/* HEADER */

.header{
  height:70px;
  padding:0 19px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  background:rgba(4,5,10,.9);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  font-size:23px;
  font-weight:900;
  letter-spacing:2.5px;
}

.logo span{
  color:var(--gold);
}

.badge{
  font-size:10px;
  color:#cbbaff;
  border:1px solid rgba(155,108,255,.25);
  background:rgba(155,108,255,.07);
  padding:8px 11px;
  border-radius:20px;
  letter-spacing:.7px;
  box-shadow:inset 0 0 18px rgba(155,108,255,.045);
}

/* PAGE */

.page{
  width:100%;
  max-width:620px;
  margin:auto;
  padding:26px 18px 30px;
}

.hero{
  text-align:center;
  padding-top:18px;
}

.eyebrow{
  color:var(--purple2);
  font-size:10px;
  letter-spacing:3px;
  font-weight:800;
  margin-bottom:15px;
}

.title{
  font-size:39px;
  line-height:1.02;

  letter-spacing:-1.5px;
}

.title span{

}

.subtitle{
  max-width:490px;
  margin:15px auto 0;
  color:var(--muted);

  line-height:1.65;
}

/* Z */

.z-wrap{
  width:160px;
  height:160px;
  margin:31px auto 26px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(155,108,255,.28);
  box-shadow:
    0 0 45px rgba(155,108,255,.12),
    inset 0 0 35px rgba(155,108,255,.055);
  position:relative;
  isolation:isolate;
  animation:zFloat 4.6s ease-in-out infinite;
}

.z-wrap:before{
  content:"";
  position:absolute;
  inset:10px;
  border-radius:50%;
  border:1px solid rgba(245,200,76,.18);
}

.z-wrap:after{
  content:"";
  position:absolute;
  inset:-1px;
  border-radius:50%;
  z-index:-1;
  box-shadow:0 0 70px rgba(155,108,255,.07);
  animation:zPulse 3.2s ease-in-out infinite;
}

.z{
  font-size:95px;
  font-weight:950;
  font-style:italic;
  color:var(--gold);
  text-shadow:0 0 28px rgba(245,200,76,.15);
}

@keyframes zFloat{
  50%{
    transform:translateY(-4px);
  }
}

@keyframes zPulse{
  50%{
    box-shadow:0 0 88px rgba(155,108,255,.13);
  }
}

.secondary{

}

.pool{

.empty-text{

/* CARDS */

.card{

.info{

}

.notice{

  padding:13px;

/* DOCUMENT */

.document{

/* NAV */

.bottom{

/* STATUS */

.status-good{

.toast{

  border-radius:13px;

@media(prefers-reduced-motion:reduce){

    transition:none!important;

</style>

<body>

<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

const API_BASE =
  "https://project-z-zryq.onrender.com";

const TON_MANIFEST_URL =
  "https://g5v4jvv5hs-web.github.io/Project-z/tonconnect-manifest.json";

/* =========================================================
   TELEGRAM
========================================================= */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

if(tg){
  tg.ready();
  tg.expand();

  try{
    tg.setHeaderColor("#04050a");
    tg.setBackgroundColor("#04050a");
  }catch(error){}
}

/* =========================================================
   STATE
========================================================= */

let projectData = {
  users:0,
  pool:0,
  poolStars:0,
  participants:[],
  winners:[]
};

let tonConnectUI = null;
let tonLibraryPromise = null;
let tonVerificationInProgress = false;

/* =========================================================
   UI HELPERS
========================================================= */

function showToast(message,type="normal"){
  const el =
    document.getElementById("toast");

  if(!el){
    return;
  }

  el.textContent = message;
  el.className = "toast show";

  if(type === "good"){
    el.classList.add("status-good");
  }

  if(type === "bad"){
    el.classList.add("status-bad");
  }

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(function(){
      el.className = "toast";
    },3500);
}

function escapeHtml(value){
  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function money(value){
  return "$" +
    Number(
      value || 0
    ).toLocaleString(
      "en-US",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );
}

/* =========================================================
   API
========================================================= */

async function api(path,options={}){
  const response =
    await fetch(
      `${API_BASE}${path}`,
      {
        ...options,
        headers:{
          "Content-Type":
            "application/json",
          ...(options.headers || {})
        }
      }
    );

  const data =
    await response
      .json()
      .catch(function(){
        return {};
      });

  if(!response.ok){
    const error =
      new Error(
        data.error ||
        `Request failed (${response.status})`
      );

    error.status =
      response.status;

    error.data =
      data;

    throw error;
  }

  return data;
}

/* =========================================================
   LOAD DATA
========================================================= */

async function loadProjectData(){
  try{
    const data =
      await api(
        "/api/stats"
      );

    projectData.users =
      Number(
        data.participants || 0
      );

    projectData.pool =
      Number(
        data.poolUsd || 0
      );

    projectData.poolStars =
      Number(
        data.poolStars || 0
      );

    projectData.participants =
      Array.isArray(
        data.participantList
      )
        ? data.participantList
        : [];
  }catch(error){
    console.error(
      "Project data loading error:",
      error
    );
  }

  try{
    const data =
      await api(
        "/api/winners"
      );

    projectData.winners =
      Array.isArray(
        data.winners
      )
        ? data.winners
        : [];
  }catch(error){
    console.error(
      "Winner data loading error:",
      error
    );
  }
}

/* =========================================================
   MOSCOW COUNTDOWN
========================================================= */

function getMoscowCountdown(){
  const now =
    new Date();

  const formatter =
    new Intl.DateTimeFormat(
      "en-US",
      {
        timeZone:
          "Europe/Moscow",
        hour12:false,
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }
    );

  const values = {};

  formatter
    .formatToParts(now)
    .forEach(function(part){
      if(
        part.type !==
        "literal"
      ){
        values[
          part.type
        ] =
          Number(
            part.value
          );
      }
    });

  const moscowNow =
    new Date(
      Date.UTC(
        values.year,
        values.month - 1,
        values.day,
        values.hour,
        values.minute,
        values.second
      )
    );

  const nextDay =
    new Date(
      moscowNow
    );

  nextDay.setUTCDate(
    nextDay.getUTCDate() + 1
  );

  nextDay.setUTCHours(
    0,
    0,
    0,
    0
  );

  return Math.max(
    0,
    Math.floor(
      (
        nextDay -
        moscowNow
      ) / 1000
    )
  );
}

function formatTime(total){
  return {
    h:String(
      Math.floor(
        total / 3600
      )
    ).padStart(
      2,
      "0"
    ),

    m:String(
      Math.floor(
        (
          total % 3600
        ) / 60
      )
    ).padStart(
      2,
      "0"
    ),

    s:String(
      total % 60
    ).padStart(
      2,
      "0"
    )
  };
}

function updateCountdown(){
  const t =
    formatTime(
      getMoscowCountdown()
    );

  const h =
    document.getElementById(
      "hours"
    );

  const m =
    document.getElementById(
      "minutes"
    );

  const s =
    document.getElementById(
      "seconds"
    );

  const next =
    document.getElementById(
      "nextDraw"
    );

  if(h){
    h.textContent = t.h;
  }

  if(m){
    m.textContent = t.m;
  }

  if(s){
    s.textContent = t.s;
  }

  if(next){
    next.textContent =
      `${t.h}:${t.m}:${t.s}`;
  }
}

setInterval(
  updateCountdown,
  1000
);

/* =========================================================
   NAV
========================================================= */

function navHTML(active){
  return `
    <div class="bottom">

      <button
        class="nav ${
          active === "home"
            ? "active"
            : ""
        }"
        data-page="home"
      >
        <div class="nav-icon">⌂</div>
        <div>Home</div>
      </button>

      <button
        class="nav ${
          active === "play"
            ? "active"
            : ""
        }"
        data-page="play"
      >
        <div class="nav-icon">▶</div>
        <div>Play</div>
      </button>

      <button
        class="nav ${
          active === "wallet"
            ? "active"
            : ""
        }"
        data-page="wallet"
      >
        <div class="nav-icon">◉</div>
        <div>Wallet</div>
      </button>

      <button
        class="nav ${
          active === "referral"
            ? "active"
            : ""
        }"
        data-page="referral"
      >
        <div class="nav-icon">♧</div>
        <div>Referral</div>
      </button>

      <button
        class="nav ${
          active === "more"
            ? "active"
            : ""
        }"
        data-page="more"
      >
        <div class="nav-icon">☰</div>
        <div>More</div>
      </button>

    </div>
  `;
}

/* =========================================================
   TON LIBRARY
========================================================= */

function loadTonLibrary(){
  if(
    window.TON_CONNECT_UI
  ){
    return Promise.resolve();
  }

  if(
    tonLibraryPromise
  ){
    return tonLibraryPromise;
  }

  tonLibraryPromise =
    new Promise(
      function(
        resolve,
        reject
      ){
        const script =
          document.createElement(
            "script"
          );

        script.src =
          "https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js";

        script.async = true;

        script.onload =
          resolve;

        script.onerror =
          function(){
            reject(
              new Error(
                "TON Connect library failed to load"
              )
            );
          };

        document.head
          .appendChild(
            script
          );
      }
    );

  return tonLibraryPromise;
}

/* =========================================================
   TON PROOF
========================================================= */

async function getTonProofNonce(){
  if(
    !tg ||
    !tg.initData
  ){
    throw new Error(
      "Open Project Z inside Telegram first."
    );
  }

  return api(
    "/api/tonconnect/nonce",
    {
      method:"POST",
      body:
        JSON.stringify({
          initData:
            tg.initData
        })
    }
  );
}

async function verifyConnectedWallet(wallet){
  if(
    tonVerificationInProgress
  ){
    return;
  }

  tonVerificationInProgress =
    true;

  const status =
    document.getElementById(
      "ton-wallet-status"
    );

  try{
    const proof =
      wallet
        ?.connectItems
        ?.tonProof
        ?.proof;

    const account =
      wallet?.account;

    if(
      !proof ||
      !account?.address ||
      !account?.walletStateInit
    ){
      if(status){
        status.textContent =
          "Wallet connected. TON ownership verification is required.";
      }

      return;
    }

    const result =
      await api(
        "/api/tonconnect/verify",
        {
          method:"POST",
          body:
            JSON.stringify({
              initData:

async function initializeTonWallet(){
  const container =
    document.getElementById(
      "ton-connect"
    );

  const status =
    document.getElementById(
      "ton-wallet-status"
    );

  if(!container){
    return;
  }

  try{
    await loadTonLibrary();

    if(tonConnectUI){
      return;
    }

    const nonceData =
      await getTonProofNonce();

    tonConnectUI =
      new TON_CONNECT_UI
        .TonConnectUI({
          manifestUrl:
            TON_MANIFEST_URL,
          buttonRootId:
            "ton-connect"
        });

    tonConnectUI
      .setConnectRequestParameters({
        state:"ready",
        value:{
          tonProof:
            nonceData.nonce
        }
      });

    tonConnectUI
      .onStatusChange(
        async function(wallet){
          if(!wallet){
            if(status){
              status.textContent =
                "Connect your TON wallet to receive Project Z prize payments.";
            }

            return;
          }

          if(status){
            status.innerHTML = `
              Wallet connected.
              Verifying ownership...
              <br>
              <span style="
                font-size:12px;
                word-break:break-all;
              ">
                ${
                  escapeHtml(
                    wallet
                      .account
                      ?.address ||
                    ""
                  )
                }
              </span>
            `;
          }

          await verifyConnectedWallet(
            wallet
          );
        }
      );

    if(
      tonConnectUI.wallet
    ){
      await verifyConnectedWallet(
        tonConnectUI.wallet
      );
    }
  }catch(error){
    console.error(
      "TON Connect initialization failed:",
      error
    );

    if(status){
      status.innerHTML = `
        <span class="status-bad">
          ${
            escapeHtml(
              error.message ||
              "Unable to initialize TON Wallet."
            )
          }
        </span>
      `;
    }
  }
}

async function attachReferralFromTelegram(){
  if(
    !tg?.initData ||
    !tg.initDataUnsafe
      ?.start_param
  ){
    return;
  }

  const code =
    String(
      tg.initDataUnsafe
        .start_param ||
      ""
    ).trim();

  if(
    !code.startsWith(
      "ref_"
    )
  ){
    return;
  }

  const key =
    `pz_ref_attached_${code}`;

  if(
    sessionStorage
      .getItem(key)
  ){
    return;
  }

  try{
    await api(
      "/api/attach-referral",
      {
        method:"POST",
        body:
          JSON.stringify({
            initData:
              tg.initData,
            code
          })
      }
    );

    sessionStorage
      .setItem(
        key,
        "1"
      );
  }catch(error){
    console.error(
      "Referral attach error:",
      error
    );
  }
}

/* =========================================================
   CONFIRM ENTRY
========================================================= */

async function confirmEntry(){
  if(!tg){
    showToast(
      "Please open Project Z inside Telegram.",
      "bad"
    );

    return;
  }

  if(!tg.initData){
    showToast(
      "Telegram authorization data is missing.",
      "bad"
    );

    return;
  }

  const button =
    document.getElementById(
      "confirm-entry-btn"
    );

  try{
    if(button){
      button.disabled =
        true;

      button.textContent =
        "CREATING PAYMENT...";
    }

    const data =
      await api(
        "/api/create-entry-invoice",
        {
          method:"POST",
          body:
            JSON.stringify({
              initData:
                tg.initData
            })
        }
      );

    if(
      data.freeEntry ===
      true
    ){
      await claimFreeEntry();

      return;
    }

    if(
      !data.invoiceLink
    ){
      throw new Error(
        "Telegram invoice was not created."
      );
    }

    tg.openInvoice(
      data.invoiceLink,
      async function(status){

        if(
          status ===
          "paid"
        ){
          showToast(
            "Payment received. Confirming entry...",
            "good"
          );

          let confirmed =
            false;

          for(
            let i = 0;
            i < 15;
            i++
          ){
            try{
              const userStatus =
                await api(
                  "/api/user-status",
                  {
                    method:"POST",
                    body:
                      JSON.stringify({
                        initData:
                          tg.initData
                      })
                  }
                );

              if(
                userStatus
                  .hasEntry ===
                true
              ){
                confirmed =
                  true;

                break;
              }
            }catch(error){
              console.error(
                "Confirmation check error:",
                error
              );
            }

            await new Promise(
              function(resolve){
                setTimeout(
                  resolve,
                  2000
                );
              }
            );
          }

          if(
            !confirmed
          ){
            showToast(
              "Payment received. Entry confirmation is still processing.",
              "bad"
            );

            if(button){
              button.disabled =
                false;

              button.textContent =
                "CONFIRM ENTRY";
            }

            return;
          }

          showToast(
            "Your Project Z entry has been confirmed.",
            "good"
          );

          await showHome();

          return;
        }

        if(
          status ===
          "cancelled"
        ){
          showToast(
            "Payment cancelled."
          );
        }

        if(
          status ===
          "failed"
        ){
          showToast(
            "Payment failed. Please try again.",
            "bad"
          );
        }

        if(button){
          button.disabled =
            false;

          button.textContent =
            "CONFIRM ENTRY";
        }
      }
    );
  }catch(error){
    console.error(
      "Payment error:",
      error
    );

    showToast(
      error.message ||
      "Unable to start Telegram Stars payment.",
      "bad"
    );

    if(button){
      button.disabled =
        false;

      button.textContent =
        "CONFIRM ENTRY";
    }
  }
}

function showSupport(){
  document
    .getElementById(
      "app"

        </div>

          </span>
        </div>

        <div class="subtitle">
          Send your message directly to Project Z support.
        </div>

        <div class="card">

          <textarea
            id="support-message"
            maxlength="2000"
            placeholder="Write your message here..."
            style="
              width:100%;
              min-height:150px;
              resize:vertical;
              border:1px solid var(--line);
              border-radius:14px;
              background:#080a10;
              color:#f7f7fa;
              padding:14px;
              font-family:inherit;
              font-size:14px;
              line-height:1.6;
              outline:none;
            "
          ></textarea>

          <button
            id="support-send-btn"
            class="primary"
            style="
              margin-top:16px;
            "
            onclick="submitSupportMessage()"
          >
            SEND MESSAGE
          </button>

          <div
            id="support-status"
            class="notice"
            style="
              display:none;
            "
          ></div>

        </div>

      </main>
    `;
}
  async function submitSupportMessage(){
  const input =
    document.getElementById(
      "support-message"
    );

  const button =
    document.getElementById(
      "support-send-btn"
    );

  const status =
    document.getElementById(
      "support-status"
    );

  const message =
    String(
      input?.value || ""
    ).trim();

  if(
    !tg ||
    !tg.initData
  ){
    showToast(
      "Please open Project Z inside Telegram.",
      "bad"
    );

    return;
  }

  if(
    message.length < 3
  ){
    showToast(
      "Please write a longer message.",
      "bad"
    );

    return;
  }

  try{
    if(button){
      button.disabled = true;
      button.textContent =
        "SENDING...";
    }

    const result =
      await api(
        "/api/support/message",
        {
          method:"POST",
          body:
            JSON.stringify({
              initData:
                tg.initData,
              message
            })
        }
      );

    if(input){
      input.value = "";
    }

    if(status){
      status.style.display =
        "block";

      status.innerHTML = `
        Message sent successfully.
        <br>
        Ticket #${result.ticketId}
      `;
    }

    showToast(
      "Support message sent.",
      "good"
    );

  }catch(error){
    if(status){
      status.style.display =
        "block";

      status.textContent =
        error.message ||
        "Unable to send support message.";
    }

    showToast(
      error.message ||
      "Unable to send support message.",
      "bad"
    );

  }finally{
    if(button){
      button.disabled = false;
      button.textContent =
        "SEND MESSAGE";
    }
  }
}

/* =========================================================
   NAVIGATION
========================================================= */

document.addEventListener(
  "click",
  function(event){

    const nav =
      event.target.closest(
        ".nav"
      );

    if(!nav){
      return;
    }

    const page =
      nav.dataset.page;

    if(
      page === "home"
    ){
      showHome();
    }

    if(
      page === "play"
    ){
      showPlay();
    }

    if(
      page === "wallet"
    ){
      showWallet();
    }

    if(
      page === "referral"
    ){
      showReferral();
    }

    if(
      page === "more"
    ){
      showMore();
    }
  }
);

   START
========================================================= */

async function startApp(){
  try{
    await attachReferralFromTelegram();

    await showHome();

    updateCountdown();
  }catch(error){
    console.error(
      "Project Z startup error:",
      error
    );

    document
      .getElementById(
        "app"
      )
      .innerHTML = `
