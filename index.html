<head>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}
:root{
  --bg:#04050a;
  --card:#0b0d15;
  --card2:#0f111b;
  --gold:#f5c84c;
  --purple:#9b6cff;
  --purple2:#c09aff;
  --text:#f7f7fa;

body{

    radial-gradient(circle at 100% 40%,rgba(76,90,255,.055),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
button{

  cursor:pointer;
}
#app{

  padding-bottom:82px;
}
/* HEADER */
.header{
  height:70px;
  padding:0 19px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  background:rgba(4,5,10,.9);
  backdrop-filter:blur(18px);
  position:sticky;
  top:0;
  z-index:50;
}
.logo{
  font-size:23px;
  font-weight:900;
  letter-spacing:2.5px;
}
.logo span{
  color:var(--gold);
}
.badge{
  font-size:10px;
  color:#cbbaff;
  border:1px solid rgba(155,108,255,.25);
  background:rgba(155,108,255,.07);
  padding:8px 11px;
  border-radius:20px;
  letter-spacing:.7px;
}
/* PAGE */
.page{
  width:100%;
  max-width:620px;
  margin:auto;
  padding:26px 18px 30px;
}
.hero{
  text-align:center;
  padding-top:18px;
}
.eyebrow{
  color:var(--purple2);
  font-size:10px;
  letter-spacing:3px;
  font-weight:800;
  margin-bottom:15px;
}
.title{
  font-size:39px;
  line-height:1.02;
  font-weight:950;
  letter-spacing:-1.5px;
}
.title span{
  color:var(--gold);
}
.subtitle{
  max-width:490px;
  margin:15px auto 0;
  color:var(--muted);
  font-size:14px;
  line-height:1.65;
}
/* Z */
.z-wrap{
  width:160px;
  height:160px;
  margin:31px auto 26px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(155,108,255,.28);
  box-shadow:
    0 0 45px rgba(155,108,255,.12),
    inset 0 0 35px rgba(155,108,255,.055);
  position:relative;
}
.z-wrap:before{
  content:"";
  position:absolute;
  inset:10px;
  border-radius:50%;
  border:1px solid rgba(245,200,76,.18);
}
.z{
  font-size:95px;
  font-weight:950;
  font-style:italic;
  color:var(--gold);
  text-shadow:0 0 28px rgba(245,200,76,.15);
}
/* BUTTONS */
.primary{
  width:100%;
  max-width:370px;
  padding:17px 20px;
  border:1px solid rgba(245,200,76,.35);
  border-radius:14px;
  background:linear-gradient(135deg,#f7d15c,#dba52a);
  color:#090a0e;
  font-size:15px;
  font-weight:900;
  letter-spacing:.3px;
  box-shadow:0 12px 35px rgba(245,200,76,.13);
}
.primary:active{
  transform:scale(.985);
}
.secondary{
  width:100%;
  max-width:370px;
  padding:15px 18px;
  margin-top:11px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#10131d;
  color:#e7e8ed;
  font-size:14px;
  font-weight:750;
}
.back{

  background:none;
  color:#9297a8;
  padding:3px 0;
  font-size:14px;
  margin-bottom:22px;
}
/* POOL */
.pool{

.pool-label{

  font-weight:800;
}
.pool-value{
  margin-top:9px;
  font-size:39px;
  font-weight:950;
  letter-spacing:-1px;
}
.pool-note{
  color:#767b8b;
  font-size:11px;
  margin-top:7px;
}
.live{

  font-size:11px;
  letter-spacing:.6px;
}
.live-dot{
  display:inline-block;
  width:6px;
  height:6px;

  margin-top:18px;

.time{

========================================================= */

/* =========================================================
   REAL DATA

========================================================= */
let projectData = {

  pool: 0,
  winners: []
};
/* =========================================================
   MOSCOW COUNTDOWN
   پایان هر فاز: 00:00 به وقت مسکو
========================================================= */
function getMoscowCountdown(){
  const now = new Date();
  const formatter = new Intl.DateTimeFormat(
    "en-US",
    {
      timeZone:"Europe/Moscow",
      hour12:false,
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    }
  );
  const parts = formatter.formatToParts(now);
  const values = {};
  parts.forEach(function(part){
    if(part.type !== "literal"){
      values[part.type] = Number(part.value);
    }
  });
  const moscowNow = new Date(
    Date.UTC(
      values.year,
      values.month - 1,
      values.day,
      values.hour,
      values.minute,
      values.second
    )
  );
  const nextDay = new Date(moscowNow);
  nextDay.setUTCDate(nextDay.getUTCDate() + 1);
  nextDay.setUTCHours(0,0,0,0);
  return Math.max(
    0,
    Math.floor((nextDay - moscowNow) / 1000)
  );
}
function formatTime(total){
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  return {
    h:String(h).padStart(2,"0"),
    m:String(m).padStart(2,"0"),
    s:String(s).padStart(2,"0")
  };
}
function updateCountdown(){
  const total = getMoscowCountdown();
  const t = formatTime(total);
  const h = document.getElementById("hours");
  const m = document.getElementById("minutes");
  const s = document.getElementById("seconds");
  const next = document.getElementById("nextDraw");
  if(h) h.textContent = t.h;
  if(m) m.textContent = t.m;
  if(s) s.textContent = t.s;
  if(next){
    next.textContent = t.h + ":" + t.m + ":" + t.s;
  }
}
setInterval(updateCountdown,1000);
/* =========================================================
   HELPERS
========================================================= */
function money(value){
  return "$" + Number(value).toLocaleString("en-US",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}
function setNav(active){
  document.querySelectorAll(".nav").forEach(function(btn){
    btn.classList.remove("active");
  });
  const selected = document.querySelector(
    '.nav[data-page="' + active + '"]'
  );
  if(selected){
    selected.classList.add("active");
  }
}
function navHTML(active){
  return `
    <div class="bottom">
      <button class="nav ${active==="home"?"active":""}" data-page="home">
        <div class="nav-icon">⌂</div>
        <div>Home</div>
